<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Publicador de Hotsites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho de passos à esquerda (topo no celular) + painel de trabalho; variáveis sempre como "marca-texto" mono */
:root{
  --paper:#F1F2EE; --panel:#FFFFFF; --sunk:#E8EAE4; --ink:#16181D; --mute:#5D626C; --line:#D6D9D1;
  --accent:#2A3DCF; --accent-ink:#FFFFFF; --accent-soft:#E3E6FB;
  --mark-bg:#F3E35A; --mark-fg:#2B2600;
  --ok:#1C7A4C; --ok-soft:#DDF0E5; --warn:#A35A06; --warn-soft:#FBEBD5; --bad:#B42318; --bad-soft:#FBE1DE;
  --f-ui:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111317; --panel:#191C21; --sunk:#14161A; --ink:#E8E9E5; --mute:#9BA0A9; --line:#2C3038;
  --accent:#8C99FF; --accent-ink:#0C0F2A; --accent-soft:#232848;
  --mark-bg:#4E4712; --mark-fg:#FFF2A0;
  --ok:#5CCB92; --ok-soft:#14301F; --warn:#F0A04B; --warn-soft:#3A2810; --bad:#FF8A7E; --bad-soft:#3D1814;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111317; --panel:#191C21; --sunk:#14161A; --ink:#E8E9E5; --mute:#9BA0A9; --line:#2C3038;
  --accent:#8C99FF; --accent-ink:#0C0F2A; --accent-soft:#232848;
  --mark-bg:#4E4712; --mark-fg:#FFF2A0;
  --ok:#5CCB92; --ok-soft:#14301F; --warn:#F0A04B; --warn-soft:#3A2810; --bad:#FF8A7E; --bad-soft:#3D1814;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.v{font-family:var(--f-mono);font-size:.86em;background:var(--mark-bg);color:var(--mark-fg);padding:.05em .35em;border-radius:3px;white-space:nowrap}
.muted{color:var(--mute)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:12px 20px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.brand svg{flex:none}
.crumb{color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.versao{font-size:12px;color:var(--mute);font-family:var(--f-mono);white-space:nowrap;margin-left:auto}
.save{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.save[data-s="ok"] i{background:var(--ok)} .save[data-s="pend"] i{background:var(--warn)} .save[data-s="erro"] i{background:var(--bad)}

/* estrutura */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;max-width:1320px;margin:0 auto;padding:28px 20px 80px}
.shell.home{grid-template-columns:minmax(0,1fr)}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px}
.rail button{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:var(--r);border:0;background:none;cursor:pointer;color:var(--mute)}
.rail button:hover{background:var(--sunk);color:var(--ink)}
.rail button[aria-current="step"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rail .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.rail .done .n{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.rail .lbl{font-weight:600;font-size:14px}
.rail .sub{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.rail hr{border:0;border-top:1px solid var(--line);margin:12px 4px}
.rail .back{grid-template-columns:28px 1fr;font-size:13px}

/* painel */
.main{min-width:0;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.head h1{font-size:32px;letter-spacing:-.02em;font-weight:700}
.head p{color:var(--mute);font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--mute)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--mute)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.big{font-size:20px;font-weight:600;padding:12px 14px}

/* formatos */
.fmt{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;text-align:left}
.fmt:hover{border-color:var(--mute)}
.fmt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fmt svg.dg{width:100%;height:96px}
.dg-k{fill:var(--accent)}
.fmt .tick svg{display:block}
.fmt h3{font-size:17px}
.fmt p{font-size:13.5px;color:var(--mute)}
.fmt .tick{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.fmt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dg-box{fill:var(--sunk);stroke:var(--mute);stroke-width:1.2}
.dg-key{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.dg-ln{stroke:var(--mute);stroke-width:1.2;fill:none}
.dg-t{fill:var(--mute);font:600 9px var(--f-ui);letter-spacing:.06em}

/* páginas */
.pg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.pg h3{font-size:19px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--mute);cursor:pointer;background:var(--sunk)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.file{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--sunk);flex-wrap:wrap}
.file .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.diff{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}

/* regra */
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rule > div{padding:14px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rule b{font-size:14px}
.rule p{font-size:13.5px;color:var(--mute)}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-align:left;font-weight:600;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);vertical-align:bottom}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.ctx{font-family:var(--f-mono);font-size:12.5px;color:var(--mute);max-width:420px;min-width:220px}
td.ctx .v{font-size:12px}
.sel{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.grid-ed td{padding:0;border-right:1px solid var(--line)}
.grid-ed td:last-child{border-right:0}
.grid-ed input,.grid-ed select{width:100%;min-width:140px;border:0;background:none;padding:10px 12px}
.grid-ed input:focus,.grid-ed select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.grid-ed input::placeholder{color:var(--mute);opacity:.7}
.grid-ed .idx{width:44px;min-width:44px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px;padding:0 8px}
.grid-ed .act{width:1%;white-space:nowrap;padding:0 6px}
.grid-ed th .v{font-size:11.5px}
.grid-ed .file-col input{font-family:var(--f-mono);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mute)}

/* conferir */
.check{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.plist{display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.plist button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;padding:8px 10px;border:0;border-radius:7px;background:none;cursor:pointer}
.plist button:hover{background:var(--sunk)}
.plist button[aria-pressed="true"]{background:var(--accent-soft)}
.plist .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .a{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .ind{padding-left:22px}
.plist .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:10px 10px 4px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)} .dot.w{background:var(--warn)}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.frame-wrap{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:center;overflow:hidden}
.frame-wrap{position:relative}
.frame-wrap iframe{flex:none;border:0;background:#fff;border-radius:6px;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.08);transform-origin:top left}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.warns{display:flex;flex-direction:column;gap:8px}
.w-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;font-size:14px}
.w-item.bad{background:var(--bad-soft)} .w-item.warn{background:var(--warn-soft)} .w-item.info{background:var(--sunk)}
.w-item b{display:block}
.w-item .ic{font-weight:700;width:18px;text-align:center}
.w-item.bad .ic{color:var(--bad)} .w-item.warn .ic{color:var(--warn)}

/* dica (?) */
.com-dica{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.dica{position:relative;display:inline-flex}
.dica-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mute);background:none;color:var(--mute);font-size:12px;font-weight:700;line-height:1;cursor:help;display:grid;place-items:center;padding:0}
.dica-btn:hover,.dica-btn:focus-visible{border-color:var(--accent);color:var(--accent)}
.dica-box{position:absolute;z-index:8;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:min(300px,80vw);padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:13.5px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;visibility:hidden;transition:opacity .15s}
.dica-box b{display:block;margin-bottom:4px}
.dica-box .v{font-size:12px}
.dica:hover .dica-box,.dica:focus-within .dica-box{opacity:1;visibility:visible}
@media (max-width:700px){.dica-box{left:auto;right:-8px;transform:none}}

/* variáveis */
.vgrps{display:flex;flex-direction:column;gap:12px}
.vgrp{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);gap:20px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;align-items:start}
.vgrp-h h2{font-size:17px;display:flex;align-items:center;gap:8px}
.vgrp-h p{font-size:13.5px;color:var(--mute);margin-top:4px}
.cnt{font-size:12px;font-weight:600;color:var(--mute);background:var(--sunk);border-radius:999px;padding:1px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipw{position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13.5px;padding:6px 10px;border-radius:6px;border:1px solid transparent;background:var(--mark-bg);color:var(--mark-fg);cursor:pointer}
.chip:hover,.chip[aria-expanded="true"]{border-color:var(--mark-fg)}
.chip svg{opacity:.6}
.chip.off{background:var(--sunk);color:var(--mute);text-decoration:line-through}
.menu{position:absolute;z-index:6;top:calc(100% + 6px);left:0;min-width:230px;display:flex;flex-direction:column;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu-t{font-size:12px;color:var(--mute);padding:6px 8px}
.menu button{text-align:left;border:0;background:none;padding:8px;border-radius:6px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--sunk)}
@media (max-width:700px){.vgrp{grid-template-columns:minmax(0,1fr);gap:12px}}

/* cadastro: colunas */
.colh{position:relative;padding:0!important}
.colh.drop-antes{box-shadow:inset 3px 0 0 var(--accent)}
.colh.drop-depois{box-shadow:inset -3px 0 0 var(--accent)}
.colh.on .colbtn{background:var(--accent-soft)}
.colbtn{display:flex;align-items:center;gap:6px;width:100%;padding:10px 12px;border:0;background:none;cursor:grab;color:inherit;font:inherit}
.colbtn:hover{background:var(--sunk)}
.grip{color:var(--mute);font-size:10px;letter-spacing:-2px;opacity:.6}
.fx{font-family:Georgia,serif;font-style:italic;font-weight:700;color:var(--accent);font-size:14px}
td.calc{position:relative}
td.calc input::placeholder{color:var(--accent);opacity:.85;font-style:italic}
td.calc.manual input{font-weight:600}
.rst{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:var(--accent-soft);color:var(--accent);border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:13px}
.colpanel{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--accent);border-radius:12px;background:var(--panel)}
.colpanel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* home: excluir */
.evw{position:relative;display:flex}
.evw .ev{flex:1;min-width:0;padding-right:48px}
.evx{position:absolute;top:12px;right:12px;opacity:.55}
.evw:hover .evx,.evx:focus-visible{opacity:1}
.evx:hover{color:var(--bad);background:var(--bad-soft)}
.evdel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px;border-radius:12px;background:var(--panel);border:1.5px solid var(--bad)}
.evw.conf .ev{visibility:hidden}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:var(--panel)}
@media (hover:none){.evx{opacity:1}}

/* imagens */
.img-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.img-lista{display:flex;flex-direction:column;gap:16px;max-height:78vh;overflow:auto;padding-right:4px}
.img-sec{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.img-sec h2{font-size:16px}
.img-slot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.img-slot:first-of-type{border-top:0;padding-top:0}
.img-slot-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-alvo{display:flex;flex-direction:column;gap:6px}
.img-quem{font-size:13px;font-weight:600}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumb{flex:none;width:104px;display:flex;flex-direction:column;gap:4px;padding:4px;border:2px solid transparent;border-radius:10px;background:var(--sunk);cursor:pointer;text-align:left}
.thumb video{width:100%;height:68px;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.thumb img{width:100%;height:68px;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.thumb span{font-size:11px;color:var(--mute);font-family:var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb:hover{border-color:var(--line)}
.thumb[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.img-grid .stage{position:sticky;top:76px}
@media (max-width:980px){.img-grid{grid-template-columns:minmax(0,1fr)}.img-lista{max-height:none}.img-grid .stage{position:static}}

/* ações da linha sempre à vista */
.grid-ed th.act,.grid-ed td.act{position:sticky;right:0;z-index:2;background:var(--panel);box-shadow:-1px 0 0 var(--line)}
.grid-ed th.idx,.grid-ed td.idx{position:sticky;left:0;z-index:2;background:var(--panel);box-shadow:1px 0 0 var(--line)}
/* cadastro com prévia */
.cad-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.cad-main{min-width:0}
.cad-prev{position:sticky;top:76px;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:calc(100vh - 96px);overflow:auto}
.cad-prev-h{display:flex;justify-content:space-between;align-items:center}
.cad-prev .frame-wrap{padding:8px}
@media (max-width:1180px){.cad-grid{grid-template-columns:minmax(0,1fr)}.cad-prev{position:static;max-height:none}}

/* publicar */
.files{columns:2 220px;font-family:var(--f-mono);font-size:13px;margin:0;padding:0;list-style:none}
.files li{padding:3px 0;break-inside:avoid;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.hist div:last-child{border-bottom:0}

/* home */
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ev{display:flex;flex-direction:column;gap:12px;text-align:left;padding:18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.ev:hover{border-color:var(--ink)}
.ev h3{font-size:18px}
.ev .meta{display:flex;gap:6px;flex-wrap:wrap}
.ev .foot{font-size:12.5px;color:var(--mute);margin-top:auto}
.ev.new{border-style:dashed;align-items:center;justify-content:center;color:var(--mute);min-height:150px;font-weight:600}
.ev.new:hover{color:var(--ink)}

.navfoot{display:flex;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;transition:.2s;pointer-events:none;z-index:20;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;margin:0 -4px}
  .rail button{grid-template-columns:24px auto;flex:none;padding:8px 10px}
  .rail .sub,.rail hr{display:none}
  .rail .n{width:22px;height:22px;font-size:11px}
  .check{grid-template-columns:minmax(0,1fr)}
  .plist{max-height:260px}
  .head h1{font-size:26px}
  .pg{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="jszip.min.js"></script>
<script>
/* ============ base ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtData = iso => { try { return new Date(iso).toLocaleString('pt-BR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}); } catch { return ''; } };
const kb = n => n > 1048576 ? (n/1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }

const FORMATOS = {
  unica: {nome:'One page', desc:'Página única, sem variáveis. Publica o HTML do jeito que ele é.', paginas:['unica']},
  tapume_praca: {nome:'Tapume + praça', desc:'Uma página home que lista páginas internas por cidade.', paginas:['tapume','praca']},
  tapume_etapa_praca: {nome:'Tapume + praça + etapa', desc:'Uma página home, um seletor de etapa e uma interna.', paginas:['tapume','praca','etapa']},
};
// nome e explicação de cada página mudam conforme o formato
function pag(k){
  const tres = S.ev && temEtapa(S.ev);
  return ({
    unica:  {nome:'Página', desc:'O HTML é publicado como está, num index.html.'},
    tapume: {nome:'Tapume', desc:'A página home. Gera uma página só, o index.html.'},
    praca:  tres ? {nome:'Praça', desc:'A página de cada cidade, com a escolha da etapa. Vira uma página para cada cidade.'}
                 : {nome:'Praça', desc:'A página interna. Vira uma página para cada cidade cadastrada.'},
    etapa:  {nome:'Etapa', desc:'A página interna de cada etapa. Vira uma página para cada etapa de cada cidade.'},
  })[k] || {nome:k, desc:''};
}
const PASSOS = [
  ['evento', 'Evento', 'Nome e formato'],
  ['paginas', 'Páginas', 'Subir os HTMLs'],
  ['variaveis', 'Variáveis', 'O que muda em cada página'],
  ['cadastro', 'Cadastro', 'Valores de cada cidade'],
  ['imagens', 'Mídia', 'Trocar imagens e vídeos'],
  ['conferir', 'Conferir', 'Prévia e avisos'],
  ['publicar', 'Publicar', 'Gerar os arquivos'],
];
const passosDo = ev => PASSOS.filter(([k]) => ev?.formato !== 'unica' || !['variaveis', 'cadastro', 'imagens'].includes(k));
const passoTxt = k => { const l = passosDo(S.ev), i = l.findIndex(p => p[0] === k); return `Passo ${i + 1} de ${l.length}`; };
const DONO = {geral:'Geral do evento', etapa:'Por etapa', cidade:'Por cidade', auto:'Automática'};

/* ============ variáveis ============ */
// @nome, @nome_N ou @{nome} (chaves quando vem texto colado depois: @{parcelamento_1}x).
// Tudo que começa com @ é variável, exceto: e-mail (x@y), pacote npm (/@scope/), comentários,
// at-rules de CSS dentro de <style> e chaves de JSON-LD.
const RX = /(?<![\w.@-])@(?:\{([A-Za-z][A-Za-z0-9_]*?)(?:_(\d+))?\}|([A-Za-z][A-Za-z0-9]*(?:_[A-Za-z][A-Za-z0-9]*)*)(?:_(\d+))?(?![\w]))/g;
const CSS_AT = new Set(['media','import','font','keyframes','supports','charset','page','namespace','container','layer','property','counter','viewport','document','scope','starting','tailwind','apply','top','bottom','left','right']);
const LD_KEYS = new Set(['context','type','id','graph','vocab','language','list','set','value','base','reverse','index','container','nest','json']);
const parteRx = m => ({base:(m[1] || m[3]).toLowerCase(), num:(m[2] || m[4]) ? +(m[2] || m[4]) : null});
// cdn.../npm/@scope/pacote não é variável
const pacote = (src, i, tok) => src[i - 1] === '/' && src[i + tok.length] === '/';
function faixas(src, rx){ const r = []; rx.lastIndex = 0; let m; while ((m = rx.exec(src))) r.push([m.index, m.index + m[0].length]); return r; }
// comentários (<!-- -->, /* */) são explicação do designer: nunca viram variável
const comentarios = src => faixas(src, /<!--[\s\S]*?-->|\/\*[\s\S]*?\*\//g);
function zonas(src){
  return {com:comentarios(src), css:faixas(src, /<style\b[\s\S]*?<\/style>|\sstyle\s*=\s*"[^"]*"/gi), ld:faixas(src, /<script[^>]*ld\+json[^>]*>[\s\S]*?<\/script>/gi)};
}
const dentro = (rs, i) => rs.some(([a, b]) => i >= a && i < b);
// @cidade_N escrito com N literal é documentação, não variável
const modelo = base => /_n$/.test(base);
const ehVar = (src, z, at, tok, base) => !(pacote(src, at, tok) || modelo(base) || dentro(z.com, at) || (CSS_AT.has(base) && dentro(z.css, at)) || (LD_KEYS.has(base) && dentro(z.ld, at)));

/* ---- blocos: <!-- @repetir cidades -->, <!-- @agrupar por regiao -->, <!-- @se status = aberta -->, <!-- @senao -->, <!-- @fim --> ---- */
const MARCA = /<!--\s*@(repetir|agrupar|se|senao|fim)\b([\s\S]*?)-->/g;
const nomeCol = s => String(s || '').trim().replace(/^@/, '').toLowerCase().replace(/[^a-z0-9_]/g, '');
function blocos(src){
  const raiz = {t:'raiz', filhos:[]}, pilha = [raiz], erros = [];
  const topo = () => pilha[pilha.length - 1];
  const destino = n => n.t === 'se' && n.emSenao ? n.senao : n.filhos;
  let ult = 0, m; MARCA.lastIndex = 0;
  while ((m = MARCA.exec(src))) {
    if (m.index > ult) destino(topo()).push({t:'txt', s:src.slice(ult, m.index)});
    ult = m.index + m[0].length;
    const kw = m[1], arg = m[2].trim();
    if (kw === 'repetir') { const n = {t:'repetir', alvo:/etapa/i.test(arg) ? 'etapa' : 'cidade', filhos:[]}; destino(topo()).push(n); pilha.push(n); }
    else if (kw === 'agrupar') { const n = {t:'agrupar', col:nomeCol(arg.replace(/^por\s+/i, '')).replace(/_\d+$/, ''), filhos:[]}; destino(topo()).push(n); pilha.push(n); }
    else if (kw === 'se') {
      const mm = arg.match(/^@?([A-Za-z][\w]*)\s*(!=|=)?\s*([\s\S]*)$/) || [];
      const n = {t:'se', col:nomeCol(mm[1]).replace(/_\d+$/, ''), op:mm[2] || '', val:(mm[3] || '').trim(), filhos:[], senao:[], emSenao:false};
      if (!n.col) erros.push('@se sem coluna'); destino(topo()).push(n); pilha.push(n);
    }
    else if (kw === 'senao') { const n = topo(); if (n.t !== 'se' || n.emSenao) erros.push('@senao fora de um @se'); else n.emSenao = true; }
    else { if (pilha.length === 1) erros.push('um @fim a mais'); else pilha.pop(); }
  }
  if (ult < src.length) destino(topo()).push({t:'txt', s:src.slice(ult)});
  pilha.slice(1).forEach(n => erros.push('@' + (n.t === 'se' ? 'se ' + n.col : n.t) + ' sem @fim'));
  return {raiz, erros};
}
// percorre os textos dizendo se estão dentro de um bloco que repete (e de quê)
function andar(nos, laco, fn, extra){
  for (const n of nos) {
    if (n.t === 'txt') fn(n.s, laco);
    else if (n.t === 'repetir') andar(n.filhos, n.alvo, fn, extra);
    else if (n.t === 'agrupar') { extra && extra(n, laco); andar(n.filhos, laco || 'cidade', fn, extra); }
    else if (n.t === 'se') { extra && extra(n, laco); andar(n.filhos, laco, fn, extra); andar(n.senao, laco, fn, extra); }
  }
}
function acharVars(html){
  const out = [];
  andar(blocos(html).raiz.filhos, null, (s, laco) => {
    const z = zonas(s); RX.lastIndex = 0; let m;
    while ((m = RX.exec(s))) { const {base, num} = parteRx(m); if (ehVar(s, z, m.index, m[0], base)) out.push({tok:m[0], base, num, laco}); }
  }, (n, laco) => { if (n.col) out.push({tok:'@' + n.col, base:n.col, num:null, laco:laco || 'cidade', sint:true, opc:n.t === 'se' && n.op ? n.val : null}); });
  return out;
}
// @total_cidades/pracas/etapas e @total_<status> são contagens; outros @total_… (ex.: @total_categorias) são variáveis comuns
const STATUS_CONHECIDOS = ['breve', 'em_breve', 'aberta', 'aberto', 'abertas', 'encerrada', 'encerrado', 'esgotada', 'esgotado', 'adiada', 'cancelada'];
const AUTO_TOTAL = {test: b => { const m = /^total_(\w+)$/.exec(b); if (!m) return false; const q = m[1];
  return ['cidades', 'pracas', 'etapas'].includes(q) || STATUS_CONHECIDOS.includes(q) || [...(S.opcoes?.status || [])].some(o => slug(o).replace(/-/g, '_') === q); }};
const raizAbrev = (base, det) => { if (!/_abrev$/.test(base)) return null; const r = base.slice(0, -6); return det.has(r) ? r : null; };
const abreviar = v => { const s = String(v || '').trim(); return s.length > 3 ? s.slice(0, 3) : s; };

/* ============ estado ============ */
const S = {prevAberta:true, chip:null, colMenu:null, novaCol:null, db:null, assets:null, downloads:null, pronto:false, eventos:[], ev:null, passo:'evento', html:{}, carregando:{}, diffs:{}, sel:0, device:'cel', confirm:null};

function novoEvento(){
  return {id:'ev-' + uid(), nome:'', formato:'tapume_praca', paginas:{}, vars:{}, gerais:{}, etapas:[], cidades:[], baseUrl:'', publicacoes:[], criadoEm:new Date().toISOString(), atualizadoEm:new Date().toISOString()};
}
const paginasDo = ev => FORMATOS[ev.formato].paginas;
const temEtapa = ev => ev.formato === 'tapume_etapa_praca';
const unica = ev => ev.formato === 'unica';

/* detecção consolidada de todas as páginas do evento */
function deteccao(){
  const ev = S.ev, mapa = new Map(); S.opcoes = {};
  for (const k of ['praca', 'etapa', 'tapume']) {
    if (!paginasDo(ev).includes(k) || S.html[k] == null) continue;
    for (const o of acharVars(S.html[k])) {
      let d = mapa.get(o.base);
      if (!d) { d = {base:o.base, por:{}, numerada:false, laco:null, nums:new Set()}; mapa.set(o.base, d); }
      if (!o.sint) d.por[k] = (d.por[k] || 0) + 1; else d.por[k] = d.por[k] || 0;
      if (o.num != null) { d.numerada = true; d.nums.add(o.num); }
      if (o.laco) d.laco = d.laco || o.laco;
      if (o.opc) (S.opcoes[o.base] = S.opcoes[o.base] || new Set()).add(o.opc);
    }
  }
  // @total_breve também diz que "breve" é um status válido
  if (S.opcoes.status) {
    for (const b of mapa.keys()) { const m = b.match(/^total_(\w+)$/); if (m && STATUS_CONHECIDOS.includes(m[1])) S.opcoes.status.add(m[1] === 'em_breve' ? 'breve' : m[1].replace(/_/g, ' ')); }
    // status: "em breve" é o padrão e sempre existe; "aberta" é a outra opção
    const ops = [...S.opcoes.status].filter(o => !['breve', 'em-breve'].includes(slug(o)));
    S.opcoes.status = new Set(['breve', ...(ops.length ? ops : ['aberta'])]);
  }
  return mapa;
}
function inferirDono(d, det){
  if (d.base === 'url' || AUTO_TOTAL.test(d.base) || raizAbrev(d.base, det)) return 'auto';
  if (d.laco) return d.laco === 'etapa' && temEtapa(S.ev) ? 'etapa' : 'cidade';
  if (!d.numerada) return 'geral';
  // home → cidade → etapa: o que só aparece na página da etapa é da etapa
  if (temEtapa(S.ev)) return d.por.etapa && !d.por.praca && !d.por.tapume ? 'etapa' : 'cidade';
  return 'cidade';
}
function sincronizarVars(){
  const det = deteccao();
  // o tipo é deduzido de novo a cada envio, até alguém escolher na mão
  for (const d of det.values()) {
    let v = S.ev.vars[d.base];
    if (!v) v = S.ev.vars[d.base] = {dono:inferirDono(d, det), ignorar:false};
    else if (!v.manual) v.dono = inferirDono(d, det);
    if (v.formula === undefined && FORMULAS_PADRAO[d.base]) v.formula = FORMULAS_PADRAO[d.base];
  }
  return det;
}
function colunas(dono){
  const det = deteccao(), ev = S.ev;
  const extras = Object.keys(ev.vars).filter(b => ev.vars[b].extra && !det.has(b));
  const lista = [...det.keys(), ...extras].filter(b => b !== 'url' && !ehImg(b) && ev.vars[b] && !ev.vars[b].excluida && !ev.vars[b].ignorar && ev.vars[b].dono === dono);
  const ordem = ev.ordem?.[dono] || [];
  const peso = b => { const i = ordem.indexOf(b); if (i >= 0) return i; const j = ORDEM_PADRAO.indexOf(b); return 1000 + (j >= 0 ? j : 500); };
  return lista.map((b, i) => [b, i]).sort((a, b) => peso(a[0]) - peso(b[0]) || a[1] - b[1]).map(x => x[0]);
}

/* ---- colunas calculadas ---- */
// sugestões: aplicadas quando a variável aparece pela primeira vez; dá para trocar ou tirar no cadastro
const FORMULAS_PADRAO = {
  preco_vista:'parcelamento * valor_parcelado',
  // à vista também funciona: digitou o preço à vista e o parcelamento, a parcela sai sozinha
  valor_parcelado:'preco_vista / parcelamento',
  preco_comum:'preco_vista / (1 - porcentagem_desconto / 100)',
  desconto_em_reais:'preco_comum - preco_vista',
  preco_prime_parcelado:'preco_prime / parcelamento',
  valor_adicional_prime:'preco_prime - preco_vista',
};
const ORDEM_PADRAO = ['cidade','uf','regiao','status','local','data_inicio','data_fim','gratuito','mes_outono','mes_inverno','mes_primavera','mes_verao','parcelamento','valor_parcelado','preco_vista','porcentagem_desconto','preco_comum','desconto_em_reais','preco_prime','preco_prime_parcelado','valor_adicional_prime','link_inscricao','link_inscricao_prime'];
function numBR(x){
  let s = String(x ?? '').replace(/R\$|\s|%/g, '').replace(/x$/i, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s); return Number.isFinite(n) ? n : null;
}
function fmtBR(n){
  const r = Math.round(n * 100) / 100, inteiro = Math.abs(r - Math.round(r)) < 1e-9;
  return r.toLocaleString('pt-BR', {minimumFractionDigits:inteiro ? 0 : 2, maximumFractionDigits:2});
}
// + − * / e parênteses; nomes = outras colunas
function avaliar(expr, get){
  const t = String(expr || '').match(/\d+(?:[.,]\d+)?|[A-Za-z_]\w*|[-+*/()×÷]/g) || [];
  let i = 0; const peek = () => t[i], next = () => t[i++];
  const prim = () => {
    const k = next();
    if (k === '(') { const v = soma(); if (next() !== ')') throw 0; return v; }
    if (k === '-') return -prim();
    if (k === undefined) throw 0;
    if (/^\d/.test(k)) return parseFloat(k.replace(',', '.'));
    if (!/^[A-Za-z_]/.test(k)) throw 0;
    const v = get(k.toLowerCase()); if (v == null) throw 0; return v;
  };
  const prod = () => { let v = prim(); while (['*', '/', '×', '÷'].includes(peek())) { const o = next(), r = prim(); v = o === '*' || o === '×' ? v * r : v / r; } return v; };
  const soma = () => { let v = prod(); while (peek() === '+' || peek() === '-') { const o = next(), r = prod(); v = o === '+' ? v + r : v - r; } return v; };
  try { const v = soma(); return i < t.length || !Number.isFinite(v) ? null : v; } catch { return null; }
}
const numerica = base => !!S.ev.vars[base]?.formula || Object.values(S.ev.vars).some(v => v.formula && nomesFormula(v.formula).includes(base));
const nomesFormula = f => [...new Set((String(f || '').match(/[A-Za-z_]\w*/g) || []).map(x => x.toLowerCase()))];
// valor final de uma coluna: o que foi digitado; se vazio e houver fórmula, o cálculo
function valorDe(it, base, vistos){
  const v = S.ev.vars[base];
  if (v?.excluida) return '';
  if (ehImg(base)) return valorImagem(base, v?.dono === 'geral' ? null : it);
  // dentro de uma conta, a própria coluna (e quem depende dela) conta como vazia: evita conta circular
  if (vistos?.has(base)) return '';
  const bruto = v?.dono === 'geral' || !it ? S.ev.gerais[base] : it[base];
  if (bruto != null && String(bruto).trim() !== '') {
    // número digitado em coluna de conta sai no mesmo formato do calculado (1720 → 1.720)
    const t = String(bruto).trim();
    if (/^-?[\d.]+(,\d+)?$/.test(t) && numerica(base)) { const n = numBR(t); if (n != null) return fmtBR(n); }
    return t;
  }
  if (base === 'status' && it && S.opcoes?.status) return 'breve';  // sem status = em breve
  if (!v?.formula || vistos?.has(base)) return '';
  const s = new Set(vistos || []); s.add(base);
  const r = avaliar(v.formula, nome => numBR(valorDe(S.ev.vars[nome]?.dono === 'geral' ? null : it, nome, s)));
  return r == null ? '' : fmtBR(r);
}
const calculado = (it, base) => { const v = S.ev.vars[base]; if (!v?.formula) return ''; const r = avaliar(v.formula, n => numBR(valorDe(S.ev.vars[n]?.dono === 'geral' ? null : it, n, new Set([base])))); return r == null ? '' : fmtBR(r); };

/* nomes e arquivos */
const PREF = {cidade:['cidade','praca','nome','local'], etapa:['etapa','nome','estacao','titulo']};
function nomeItem(tipo, item, i){
  for (const p of PREF[tipo]) if (item[p]) return item[p];
  const c = colunas(tipo);
  // a coluna de nome existe mas está vazia: não usa outra coluna (ex.: UF) como nome
  if (!PREF[tipo].some(p => c.includes(p))) for (const k of c) if (item[k]) return item[k];
  return (tipo === 'etapa' ? 'Etapa ' : 'Cidade ') + (i + 1);
}

function idxDe(tipo, item){ return (tipo === 'etapa' ? S.ev.etapas : S.ev.cidades).indexOf(item); }
function arqPadrao(tipo, item){
  if (tipo === 'etapa') {
    const e = slug(nomeItem('etapa', item, idxDe('etapa', item))) || 'etapa-' + (idxDe('etapa', item) + 1);
    const c = S.ev.cidades.find(x => x._id === item._cidade);
    return (c ? arquivo('cidade', c).replace(/\.html?$/i, '') + '-' : '') + e + '.html';
  }
  return (slug(nomeItem('cidade', item, idxDe('cidade', item))) || 'cidade-' + (idxDe('cidade', item) + 1)) + '.html';
}
const arquivo = (tipo, item) => (item._arquivo || '').trim() || arqPadrao(tipo, item);
const etapasDa = c => S.ev.etapas.filter(e => e._cidade === c._id);

    .replace(/<img\b([^>]*?)(?<![\w-])src=(["'])([^"']+)\2([^>]*?)\/?>/gi, (t, a, q, src, b) => VID.test(src) ? paraVideo(a + b, q, src) : t)

const TIPOS = {png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml', avif:'image/avif', mp4:'video/mp4', webm:'video/webm', woff2:'font/woff2', woff:'font/woff', ttf:'font/ttf', otf:'font/otf', css:'text/css', js:'text/javascript', json:'application/json', pdf:'application/pdf'};

let _idb = null;
const abrirIdb = () => _idb || (_idb = new Promise((res, rej) => {
  const r = indexedDB.open('publicador-hotsites', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('eventos'); r.result.createObjectStore('arquivos'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);

async function idbTx(store, modo, fn){

const dbLocal = {

/* ============ tapume com cards fixos → card que se repete ============ */
// Acha os cards numerados (@cidade_1, @cidade_2…), usa o primeiro de cada tipo como modelo e monta os blocos.
const RX_NUM = /@(\{?)([A-Za-z][A-Za-z0-9_]*?)_(\d+)(\}?)(?![\w])/g;
function numsDoTexto(s){ const out = new Set(); RX_NUM.lastIndex = 0; let m; while ((m = RX_NUM.exec(s || ''))) out.add(+m[3]); return out; }
function temCardsFixos(html){
  if (!html || /<!--\s*@repetir/i.test(html)) return 0;
  const sem = html.replace(/<!--[\s\S]*?-->/g, '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '');
  const n = numsDoTexto(sem); return n.size >= 2 ? Math.max(...n) : 0;
}
function converterCards(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const proprios = el => { const s = new Set(); for (const a of el.attributes) numsDoTexto(a.value).forEach(n => s.add(n)); for (const c of el.childNodes) if (c.nodeType === 3) numsDoTexto(c.nodeValue).forEach(n => s.add(n)); return s; };
  const sub = new Map();
  (function anda(el){ const s = proprios(el); for (const c of el.children) { if (/^(SCRIPT|STYLE|TEMPLATE)$/.test(c.tagName)) continue; anda(c).forEach(n => s.add(n)); } sub.set(el, s); return s; })(doc.body);
  // raiz de cada card: o maior elemento que só fala de um número
  const raizes = new Map();
  for (const [el, s] of sub) { if (s.size !== 1 || el === doc.body) continue; const p = sub.get(el.parentElement); if (p && p.size > 1) { const n = [...s][0]; if (!raizes.has(n)) raizes.set(n, []); raizes.get(n).push(el); } }
  const nums = [...raizes.keys()].sort((a, b) => a - b);
  if (nums.length < 2 || nums.some(n => raizes.get(n).length !== 1)) return {erro:'Não consegui identificar um card por cidade neste HTML.'};
  // card sozinho num grupo sobe até o grupo inteiro: desce de volta até o elemento com a mesma "cara" dos outros cards
  const cara = el => el.tagName + '.' + (el.classList[0] || '');
  const freq = {}; nums.forEach(n => { const k = cara(raizes.get(n)[0]); freq[k] = (freq[k] || 0) + 1; });
  const caraComum = Object.entries(freq).sort((a, b) => b[1] - a[1])[0][0], classeComum = caraComum.split('.')[1];
  nums.forEach(n => {
    const el = raizes.get(n)[0]; if (cara(el) === caraComum || !classeComum) return;
    const dentro = [...el.querySelectorAll('.' + CSS.escape(classeComum))].find(x => { const s = sub.get(x); return s && s.size === 1 && s.has(n); });
    if (dentro) raizes.set(n, [dentro]);
  });
  const cards = nums.map(n => ({n, el:raizes.get(n)[0]}));
  // grupos (ex.: uma <section> por região)
  const pais = [...new Set(cards.map(c => c.el.parentElement))];
  let grupos = null, col = null;
  if (pais.length > 1) {
    const comum = (() => { let a = pais[0]; while (a && !pais.every(p => a.contains(p))) a = a.parentElement; return a; })();
    const secao = el => { let g = el; while (g.parentElement !== comum) g = g.parentElement; return g; };
    const gs = [...new Set(cards.map(c => secao(c.el)))];
    const attr = [...gs[0].attributes].find(a => /^data-/.test(a.name) && new Set(gs.map(g => g.getAttribute(a.name))).size === gs.length);
    const valor = g => attr ? g.getAttribute(attr.name) : (g.querySelector('h1,h2,h3,h4')?.firstChild?.nodeValue || '').trim();
    col = attr ? attr.name.replace(/^data-/, '').replace(/-/g, '_') : 'grupo';
    grupos = gs.map(g => ({el:g, valor:valor(g), cards:cards.filter(c => g.contains(c.el))}));
    cards.forEach(c => { c.grupo = grupos.find(g => g.cards.includes(c)).valor; });
  }
  const escRx = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // modelo de cada card: sem número e com o grupo virando @coluna
  const modelo = c => {
    let h = c.el.outerHTML.replace(RX_NUM, (t, a, b, n, z) => '@' + a + b + z);
    if (c.grupo) h = h.replace(new RegExp('(?<![\\w@])' + escRx(c.grupo) + '(?![\\w])', 'gi'), '@' + col);
    return h;
  };
  const chaveVar = h => h.replace(/@\w+/g, '@');
  const variantes = [];
  for (const c of cards) { const h = modelo(c), k = chaveVar(h); let v = variantes.find(x => x.k === k); if (!v) variantes.push(v = {k, h, cards:[], classes:new Set(c.el.classList)}); v.cards.push(c); c.v = v; }
  if (variantes.length > 2) return {erro:'Os cards deste HTML têm mais de dois formatos diferentes; converta à mão com @repetir e @se.'};
  let status = null;
  if (variantes.length === 2) {
    const [a, b] = variantes, sa = [...a.classes].filter(x => !b.classes.has(x)), sb = [...b.classes].filter(x => !a.classes.has(x));
    status = {aberta:sa[0] || 'aberta', outra:sb[0] || 'breve'};
    // o formato com link vem primeiro
    if (!/^<a\b/i.test(a.h) && /^<a\b/i.test(b.h)) { variantes.reverse(); status = {aberta:sb[0] || 'aberta', outra:sa[0] || 'breve'}; }
    cards.forEach(c => { c.status = c.v === variantes[0] ? status.aberta : status.outra; });
  }
  const bloco = (variantes.length === 2
    ? `\n<!-- @repetir cidades -->\n<!-- @se status = ${status.aberta} -->\n${variantes[0].h}\n<!-- @senao -->\n${variantes[1].h}\n<!-- @fim -->\n<!-- @fim -->\n`
    : `\n<!-- @repetir cidades -->\n${variantes[0].h}\n<!-- @fim -->\n`);
  const marca = 'PUBLICADOR_BLOCO_' + uid();
  const trocarCards = (pai, lista) => { const ref = lista[0].el; ref.before(doc.createComment(marca)); lista.forEach(c => c.el.remove()); };
  if (grupos) {
    const g0 = grupos[0];
    trocarCards(g0.cards[0].el.parentElement, g0.cards);
    // cabeçalho do grupo: nome vira @regiao, número de cards vira @total_cidades
    const it = doc.createTreeWalker(g0.el, NodeFilter.SHOW_TEXT); let t;
    while ((t = it.nextNode())) {
      if (t.nodeValue.trim().toLowerCase() === g0.valor.toLowerCase()) t.nodeValue = t.nodeValue.replace(new RegExp(escRx(g0.valor), 'i'), '@' + col);
      else if (t.nodeValue.trim() === String(g0.cards.length)) t.nodeValue = t.nodeValue.replace(String(g0.cards.length), '@total_cidades');
    }
    for (const a of g0.el.attributes) if (a.value === g0.valor) a.value = '@' + col;
    g0.el.before(doc.createComment(' @agrupar por ' + col + ' '));
    g0.el.after(doc.createComment(' @fim '));
    grupos.slice(1).forEach(g => g.el.remove());
  } else trocarCards(cards[0].el.parentElement, cards);
  // contagens soltas ("5 com inscrição aberta · 11 em breve")
  if (status) {
    const conta = {[status.aberta]:cards.filter(c => c.status === status.aberta).length, [status.outra]:cards.filter(c => c.status === status.outra).length};
    const it = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT); let t; const textos = [];
    while ((t = it.nextNode())) if (!t.parentElement.closest('script,style')) textos.push(t);
    for (const t of textos) for (const [s, n] of Object.entries(conta)) {
      if (new RegExp('(?<!\\d)' + n + '(?!\\d)').test(t.nodeValue) && t.parentElement.textContent.toLowerCase().includes(s.toLowerCase()))
        t.nodeValue = t.nodeValue.replace(new RegExp('(?<!\\d)' + n + '(?!\\d)'), '@total_' + s.replace(/\W+/g, '_'));
    }
  }
  const dt = html.match(/^\s*<!doctype[^>]*>/i)?.[0] || '<!doctype html>';
  const final = dt + '\n' + doc.documentElement.outerHTML.replace('<!--' + marca + '-->', bloco);
  return {html:final, cards:cards.length, col, grupos:grupos?.map(g => g.valor), status,
    prefill:cards.map(c => ({n:c.n, grupo:c.grupo, status:c.status}))};
}

/* ============ imagens por seção ============ */
// @img_<secao>_<nome> escolhe uma imagem e @video_<secao>_<nome> um vídeo da pasta _media/<pagina>/<secao>/.
// Com _1 (ou dentro de bloco), é por cidade.
// @media_<secao>_<nome> aceita imagem OU vídeo: o publicador troca a tag <img>/<video> conforme o arquivo escolhido
const ehImg = base => /^(img|video|media)_[a-z0-9]+/.test(base);
const ehVideoVar = base => /^video_/.test(base);
const tipoMidia = base => base.split('_')[0];
// versão de tela: slot ..._desktop só vê arquivos de desktop, ..._mobile só de mobile
const RX_DESK = /(^|[_\-/.])(desktop|desk)([_\-/.]|$)/i, RX_MOB = /(^|[_\-/.])(mobile|mob|celular)([_\-/.]|$)/i;
const versaoTela = nome => RX_DESK.test(nome) ? 'desktop' : RX_MOB.test(nome) ? 'mobile' : '';
const secaoImg = base => base.split('_')[1] || '';
const slotImg = base => base.split('_').slice(2).join('_') || secaoImg(base);
const PASTA_PAG = {tapume:'tapume', praca:'praca', etapa:'etapa', unica:'pagina'};
const ehImagemArq = k => /^image\//.test(TIPOS[ext(k)] || '');
const ehVideoArq = k => /^video\//.test(TIPOS[ext(k)] || '');
// _media/ (atual) ou _images/ (versão anterior do guia)
const caminhoImg = k => { const m = k.match(/(^|\/)(_media|_images)\//); return m ? k.slice(m.index + m[1].length) : k; };
const pastasVer = base => pastasImg(base).filter(p => p.startsWith('_media'));
function pastasImg(base){
  const det = S.detCache || deteccao(), d = det.get(base);
  const kinds = d ? Object.keys(d.por) : ['praca'];
  return [...new Set(kinds.flatMap(k => ['_media', '_images'].map(r => `${r}/${PASTA_PAG[k] || k}/${secaoImg(base)}/`)))];
}
// opções de uma variável de imagem: só as imagens das pastas da seção dela
function opcoesImg(base){
  const pastas = pastasImg(base), vistas = new Set(), out = [];
  for (const k of Object.keys(arquivosDo())) { const c = caminhoImg(k), t = tipoMidia(base);
    const tipoOk = t === 'video' ? ehVideoArq(c) : t === 'img' ? ehImagemArq(c) : (ehVideoArq(c) || ehImagemArq(c));
    const vSlot = versaoTela(slotImg(base)), vArq = versaoTela(c.slice(pastas.find(p => c.startsWith(p))?.length || 0));
    const telaOk = !vSlot || !vArq || vSlot === vArq;
    if (tipoOk && telaOk && pastas.some(p => c.startsWith(p)) && !vistas.has(c)) { vistas.add(c); out.push({k, caminho:c}); } }
  return out.sort((a, b) => a.caminho.localeCompare(b.caminho));
}
function padraoImg(base, ops){
  const nome = slotImg(base), img = o => ehImagemArq(o.caminho);
  const mesmos = ops.filter(o => o.caminho.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase() === nome);
  // na dúvida, começa com imagem: vídeo é escolha de quem publica
  return (mesmos.find(img) || mesmos[0] || ops.find(img) || ops[0])?.caminho || '';
}
function valorImagem(base, it){
  const ops = opcoesImg(base), escolhido = it ? it[base] : (S.ev.imagens || {})[base];
  if (escolhido && ops.some(o => o.caminho === escolhido)) return escolhido;
  return padraoImg(base, ops);
}

/* ============ salvar ============ */
let saveT = null, salvando = false, denovo = false;
function setSave(s, txt){ const el = $('#save'); el.dataset.s = s; el.lastElementChild.textContent = txt; }
function salvar(){
  if (!S.ev) return; S.ev.atualizadoEm = new Date().toISOString();
  if (!S.db) { setSave('pend', 'Só nesta sessão'); return; }
  setSave('pend', 'Salvando…'); clearTimeout(saveT); saveT = setTimeout(flush, 700);
}
async function flush(){
  if (!S.db || !S.ev) return;
  if (salvando) { denovo = true; return; }
  salvando = true; const ev = S.ev;
  try { await S.db.doc('eventos/' + ev.id).set(JSON.parse(JSON.stringify(ev))); setSave('ok', S.local ? 'Salvo neste navegador' : 'Salvo'); }
  catch (e) { setSave('erro', e?.code === 'quota_exceeded' ? 'Sem espaço para salvar' : 'Não salvou — tente de novo'); }
  salvando = false; if (denovo) { denovo = false; flush(); }
}

// troca o conteúdo da tela sem recriar a prévia (sem piscar) e sem perder rolagem e foco
function trocarTela(html){
  const m = $('#main'), chave = S.ev.id + ':' + S.passo;
  const rolX = [...m.querySelectorAll('.tw')].map(t => t.scrollLeft), rolY = window.scrollY, lista = $('#img-lista')?.scrollTop;
  const ae = document.activeElement, foco = ae && m.contains(ae) && ae.dataset?.row ? {row:ae.dataset.row, col:ae.dataset.col, ini:ae.selectionStart, fim:ae.selectionEnd} : null;
  const novo = document.createElement('div'); novo.innerHTML = html;
  const fundir = (O, N) => {
    const ok = c => c.nodeType === 1 && (c.matches('[data-manter]') || c.querySelector('[data-manter]'));
    const oK = [...O.children].find(ok), nK = [...N.children].find(ok);
    if (!oK || !nK) return false;
    [...O.childNodes].forEach(c => { if (c !== oK) c.remove(); });
    const filhos = [...N.childNodes], i = filhos.indexOf(nK);
    filhos.slice(0, i).forEach(c => O.insertBefore(c, oK)); filhos.slice(i + 1).forEach(c => O.appendChild(c));
    if (oK.matches('[data-manter]')) return true;
    oK.className = nK.className; return fundir(oK, nK);
  };
  if (!(S.telaAtual === chave && m.querySelector('[data-manter]') && novo.querySelector('[data-manter]') && fundir(m, novo))) m.innerHTML = html;
  S.telaAtual = chave;
  [...m.querySelectorAll('.tw')].forEach((t, i) => { if (rolX[i] != null) t.scrollLeft = rolX[i]; });
  if (lista != null && $('#img-lista')) $('#img-lista').scrollTop = lista;
  window.scrollTo(0, rolY);
  if (foco) { const el = m.querySelector(`[data-row="${foco.row}"][data-col="${foco.col}"]`); if (el) { el.focus({preventScroll:true}); try { el.setSelectionRange(foco.ini, foco.fim); } catch {} } }
}
function feito(p){
  const ev = S.ev;
  if (p === 'evento') return !!ev.nome.trim();
  if (p === 'imagens') { const imgs = Object.keys(ev.vars).filter(b => ehImg(b) && !ev.vars[b].ignorar && (S.detCache || deteccao()).has(b)); return imgs.length > 0 && imgs.every(b => opcoesImg(b).length); }
  if (p === 'paginas') return paginasDo(ev).every(k => ev.paginas[k]);
  if (p === 'variaveis') return paginasDo(ev).every(k => ev.paginas[k]) && Object.keys(ev.vars).length > 0;
  if (p === 'cadastro') return ev.cidades.length > 0;
  if (p === 'conferir') {
    if (unica(ev)) return S.html.unica != null;
    if (!ev.cidades.length || !paginasDo(ev).every(k => S.html[k] != null) || (temEtapa(ev) && !ev.etapas.length)) return false;
    const nomes = [...ev.cidades.map(c => arquivo('cidade', c)), ...(temEtapa(ev) ? ev.etapas.filter(e => cidadeDa(e)).map(e => arquivo('etapa', e)) : []), 'index.html'];
    return new Set(nomes).size === nomes.length;
  }
  if (p === 'publicar') return ev.publicacoes.length > 0;
}

}

async function excluirEvento(id){
  const e = S.eventos.find(x => x.id === id) || (S.ev?.id === id ? S.ev : null);
  const nome = e?.nome || 'Evento sem nome';
  S.eventos = S.eventos.filter(x => x.id !== id); S.confirm = null;
  if (S.ev?.id === id) { S.ev = null; clearTimeout(saveT); }
  render();
  if (S.db) {
    try { await S.db.doc('eventos/' + id).delete(); }
    catch { toast('Não foi possível excluir agora. Tente de novo.'); return; }
  }

    const ids = [...Object.values(e.paginas || {}), ...Object.values(e.arquivos || {})].map(x => x?.asset).filter(Boolean);
    for (const a of ids) { try { await S.assets.delete(a); } catch {} }
  }
}
async function abrir(id){
  const e = S.eventos.find(x => x.id === id); if (!e) return;
  S.ev = JSON.parse(JSON.stringify(e)); S.html = {}; S.diffs = {}; S.arqLocal = {}; S.arqBlob = {}; S.dataUrl = {}; S.colMenu = null; S.novaCol = null; S.sel = 0; S.confirm = null;

    catch { p.erro = true; }

  if (S.ev?.id === id) { sincronizarVars(); render(); }
}

async function receberArquivo(k, file){
  if (!file) return;
  if (!/\.html?$/i.test(file.name) && file.type !== 'text/html') { toast('Esse arquivo não é .html'); return; }
  let text = await file.text(), conv = null;
  // listas com cards fixos (@cidade_1, @cidade_2…) viram um card que se repete
  if (k === 'tapume' && temCardsFixos(text)) { conv = converterCards(text); if (conv.html) text = conv.html; }
  const antes = S.html[k] != null ? new Set(acharVars(S.html[k]).map(o => o.base)) : null;
  S.html[k] = text;
  const depois = new Set(acharVars(text).map(o => o.base));
  if (antes) {
    const novas = [...depois].filter(b => !antes.has(b)), saiu = [...antes].filter(b => !depois.has(b));
    S.diffs[k] = novas.length || saiu.length
      ? `Arquivo trocado. ${novas.length ? 'Novas: ' + novas.map(b => `<span class="v">@${esc(b)}</span>`).join(' ') + '. ' : ''}${saiu.length ? 'Saíram: ' + saiu.map(b => `<span class="v">@${esc(b)}</span>`).join(' ') + ' (os valores ficam guardados).' : ''}${novas.length ? ' Confira o passo Variáveis.' : ''}`
      : 'Arquivo trocado. As variáveis são as mesmas da versão anterior, o cadastro continua valendo.';
  } else delete S.diffs[k];
  if (conv) S.diffs[k] = msgConv(conv, k) + (S.diffs[k] ? '<br>' + S.diffs[k] : '');
  const reg = {arquivo:file.name, bytes:text.length, enviadoEm:new Date().toISOString(), ...(conv?.html ? {convertido:true} : {})};
  if (S.assets) {
    try { const r = await S.assets.upload(new Blob([text], {type:'text/plain'}), {type:'text/plain'}); reg.asset = r.id; }
    catch (e) { reg.local = true; toast(e?.code === 'too_large' ? 'Arquivo acima de 20 MB — não foi guardado' : 'Não deu para guardar o arquivo; ele vale só nesta sessão'); }
  } else reg.local = true;
  S.ev.paginas[k] = reg;
  sincronizarVars(); salvar(); render();
  toast(pag(k).nome + ': ' + depois.size + ' variáveis encontradas');
}

function msgConv(c, k){
  if (!c.html) return `<b>Este HTML tem cards fixos numerados.</b> ${esc(c.erro)} Cards fixos ficam vazios quando há menos cidades cadastradas.`;
  return `<b>Este HTML tinha ${c.cards} cards fixos.</b> Agora é um card só, que se repete para cada cidade cadastrada${c.col ? `, separado por <span class="v">@${esc(c.col)}</span>` : ''}${c.status ? `, e sai como “${esc(c.status.aberta)}” ou “${esc(c.status.outra === 'breve' ? 'em breve' : c.status.outra)}” conforme a coluna <span class="v">@status</span>` : ''}. As contagens viraram automáticas. <button class="btn sm ghost" type="button" data-baixarconv="${k}" style="padding:2px 6px">Baixar HTML convertido</button>`;
}
async function converterExistente(k){

  S.html[k] = c.html; const reg = {...S.ev.paginas[k], bytes:c.html.length, convertido:true, enviadoEm:new Date().toISOString()};
  if (S.assets) { try { const r = await S.assets.upload(new Blob([c.html], {type:'text/plain'}), {type:'text/plain'}); if (reg.asset && reg.asset !== r.id) S.assets.delete(reg.asset).catch(() => {}); reg.asset = r.id; delete reg.local; } catch { reg.local = true; } }
  S.ev.paginas[k] = reg; S.diffs[k] = msgConv(c, k); sincronizarVars(); salvar(); render(); toast(pag(k).nome + ': cards fixos viraram um card que se repete');
}

  ${resumoBlocos()}
  ${todas.length ? `<div class="vgrps">
    ${bloco('geral', 'Igual em todas as páginas', 'Você preenche uma vez e o valor aparece em todas as páginas.')}

    ${bloco('img', 'Imagens e vídeos', 'Cada uma escolhe um arquivo da pasta da sua seção. Você troca no passo Mídia. Clique para dizer se é igual em todas as páginas ou muda em cada cidade.')}
    ${bloco('auto', 'Preenchidas sozinhas', 'Você não precisa preencher. O publicador cuida dos links entre as páginas, das contagens e das abreviações.')}

  </div>` : `<div class="card empty">Nenhuma variável encontrada ainda. Suba os HTMLs no passo anterior.</div>`}

function resumoBlocos(){
  const itens = [];
  for (const k of paginasDo(S.ev)) {
    if (S.html[k] == null) continue;
    const {raiz, erros} = blocos(S.html[k]), frases = [];
    const ver = (nos, grupo) => nos.forEach(n => {
      if (n.t === 'repetir') {
        const item = n.alvo === 'etapa' ? 'etapa' : 'cidade', se = n.filhos.find(f => f.t === 'se' && f.op);
        let f = `O publicador cria um card para cada ${item} cadastrada`;
        if (grupo) f += ` e junta os cards por <span class="v">@${esc(grupo)}</span>`;
        f += '.';
        if (se) f += ` Quando <span class="v">@${esc(se.col)}</span> é “${esc(rotuloOpcao(se.val))}”, o card usa um modelo; nos outros casos (como “em breve”), usa outro.`;
        frases.push(f);
      }
      else if (n.t === 'agrupar') ver(n.filhos, n.col);
      else if (n.t === 'se') { ver(n.filhos, grupo); ver(n.senao, grupo); }
    });
    ver(raiz.filhos, null);
    if (erros.length) itens.push(`<div class="w-item bad"><span class="ic">✕</span><div><b>${pag(k).nome}: o HTML tem um bloco aberto e não fechado</b>${esc(erros.join(' · '))}. Peça ao designer para conferir.</div></div>`);
    else if (frases.length) itens.push(`<div class="w-item info"><span class="ic">↻</span><div><b>${pag(k).nome}: tem um bloco</b>Bloco é um pedaço da página que se repete, como o card de cada cidade. ${frases.join(' ')} Sem cidade cadastrada, não aparece card.</div></div>`);
  }
  return itens.length ? `<div class="warns">${itens.join('')}</div>` : '';
}

function comBase(html){
  const b = (S.ev.baseUrl || '').trim(); if (!b) return html;
  const tag = `<base href="${esc(b.endsWith('/') ? b : b + '/')}">`;
  return /<head[^>]*>/i.test(html) ? html.replace(/<head([^>]*)>/i, `<head$1>${tag}`) : tag + html;

async function mostrarPrevia(){
  const p = S.ger?.pags[S.sel]; if (!p) return;
  const vez = (S.vezPrevia = (S.vezPrevia || 0) + 1);
  if (S.prevPag !== p.arquivo) { S.prevPag = p.arquivo; S.prevScroll = 0; }
  const html = await comArquivos(comBase(p.html));
  if (vez !== S.vezPrevia) return;
  if (S.janela && !S.janela.closed) escreverJanela(html, p.titulo + ' — ' + p.arquivo);
  const fw = $('#fw'); if (!fw) return;
  const W = S.device === 'cel' ? 390 : 1280, H = S.device === 'cel' ? 780 : 800;
  const pad = parseFloat(getComputedStyle(fw).paddingLeft) || 0, sc = Math.min(1, (fw.clientWidth - pad * 2) / W);
  const estilo = f => { f.style.width = W + 'px'; f.style.height = H + 'px'; f.style.transform = `scale(${sc})`; };
  fw.style.height = (H * sc + pad * 2) + 'px'; fw.style.justifyContent = sc < 1 ? 'flex-start' : 'center';
  const atual = fw.querySelector('iframe.ativo');
  if (atual) estilo(atual);
  if (atual && atual._html === html) return;           // nada mudou: não recarrega
  fw.querySelectorAll('iframe:not(.ativo)').forEach(f => f.remove());
  // a página nova carrega escondida atrás da atual e só troca quando estiver pronta (sem piscar)
  const novo = document.createElement('iframe');
  novo.title = 'Prévia da página'; novo.setAttribute('sandbox', 'allow-scripts'); novo._html = html; estilo(novo);
  if (atual) Object.assign(novo.style, {position:'absolute', left:pad + 'px', top:pad + 'px', visibility:'hidden'});
  novo.onload = () => {
    if (!novo.isConnected) return;
    if (atual && atual.isConnected) { atual.remove(); }
    Object.assign(novo.style, {position:'', left:'', top:'', visibility:''});
    fw.querySelectorAll('iframe.ativo').forEach(f => { if (f !== novo) f.remove(); });
    novo.classList.add('ativo'); novo.id = 'prev';
  };
  if (!atual) { novo.classList.add('ativo'); novo.id = 'prev'; }
  fw.appendChild(novo); novo.srcdoc = comRolagem(html, S.prevScroll);
}

function comRolagem(html, y){
  const js = `<script>(function(){var y=${Math.round(y || 0)};function v(){scrollTo(0,y)}addEventListener('load',v);setTimeout(v,50);setTimeout(v,400);addEventListener('scroll',function(){parent.postMessage({pubScroll:scrollY},'*')},{passive:true})})()<\/script>`;
  return /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, js + '</body>') : html + js;
}
function abrirJanela(){
  let w = null;
  try { w = window.open('', 'publicador-previa', 'width=440,height=900'); } catch {}
  if (!w) { toast('O navegador bloqueou a janela. Libere pop-ups para esta página ou use a versão em .zip.'); return; }
  S.janela = w; S.janelaPag = null; S.ger = gerar(); mostrarPrevia(); toast('Prévia aberta em outra janela');
}
async function escreverJanela(html, titulo){
  const w = S.janela; if (!w || w.closed) return;
  try {
    const mesma = S.janelaPag === titulo, y = mesma ? (w.scrollY || 0) : 0;
    w.document.open(); w.document.write(html); w.document.close();
    S.janelaPag = titulo;
    const volta = () => { try { w.scrollTo(0, y); } catch {} };
    setTimeout(volta, 60); setTimeout(volta, 400);
    try { w.document.title = 'Prévia · ' + titulo; } catch {}
  } catch { S.janela = null; toast('Não foi possível atualizar a outra janela'); }
}

async function gerarZip(){
  const g = gerar(); if (g.bloqueado) return;
  if (!window.JSZip) { toast('Não foi possível montar o .zip agora'); return; }
  if (!S.downloads) { toast('Download indisponível nesta visualização'); return; }
  const zip = new JSZip(), postos = new Set(); g.pags.forEach(p => zip.file(p.arquivo, p.html));
  for (const p of g.pags) for (const ref of refsDe(p.html)) {
    const caminho = normRef(ref), k = acharArquivo(ref); if (!k || postos.has(caminho) || caminho.startsWith('/') || caminho.includes('..')) continue;
    const b = await blobDe(k); if (b) { zip.file(caminho, b); postos.add(caminho); }
  }
  const d = new Date(), nome = (slug(S.ev.nome) || 'evento') + '-' + d.toISOString().slice(0, 10) + '.zip';
  const blob = await zip.generateAsync({type:'blob'});
  try {
    await S.downloads.save({filename:nome, data:blob});
    S.ev.publicacoes.push({em:d.toISOString(), paginas:g.pags.length, avisos:g.avisos.length, arquivo:nome});
    salvar(); render(); toast('Pacote gerado: ' + nome);
  } catch (e) { if (e?.code !== 'declined') toast('Não foi possível baixar o .zip'); }
}

// nova linha = cópia da de cima, sem o nome (cada linha é outra cidade/etapa) e sem o arquivo
function copiaLinha(t, base){
  const novo = base ? JSON.parse(JSON.stringify(base)) : {};
  novo._id = uid(); delete novo._arquivo; delete novo.status;
  const nome = PREF[t].find(k => colunas(t).includes(k)); if (nome) novo[nome] = '';
  return novo;
}
function focarNome(t, it){
  const nome = PREF[t].find(k => colunas(t).includes(k));
  setTimeout(() => ($(`[data-row="${it._id}"][data-col="${nome}"]`) || $(`[data-row="${it._id}"][data-ci="0"]`))?.focus(), 20);
}
function item(t, id){ return (t === 'etapa' ? S.ev.etapas : S.ev.cidades).find(x => x._id === id); }
function colar(e, inp){
  const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  if (!/[\t\n]/.test(txt.trim())) return;
  e.preventDefault();
  const t = inp.dataset.tbl, lista = t === 'etapa' ? S.ev.etapas : S.ev.cidades, cols = colunas(t);
  const linhas = txt.replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(l => l.split('\t'));
  let r = lista.findIndex(x => x._id === inp.dataset.row); const c0 = +inp.dataset.ci;
  linhas.forEach(cells => {
    if (!lista[r]) { const n = {_id:uid()}; if (t === 'etapa' && S.ev.cidades.length === 1) n._cidade = S.ev.cidades[0]._id; lista.push(n); }
    cells.forEach((v, k) => { const col = cols[c0 + k]; if (col) lista[r][col] = v.trim(); });
    r++;
  });
  salvar(); render(); toast(linhas.length + ' linha(s) coladas');
}

/* ============ início ============ */
async function boot(){
  render();
  const c = window.claude;
  if (!c?.use) {
    // fora do Claude: guarda os eventos e arquivos neste navegador
    try { await abrirIdb(); Object.assign(S, {local:true, db:dbLocal, assets:assetsLocal, downloads:downloadsLocal}); setSave('ok', 'Salvo neste navegador'); }
    catch { S.pronto = true; setSave('pend', 'Só nesta sessão'); render(); return; }
    S.db.collection('eventos').onSnapshot(snap => { S.eventos = snap.docs.map(d => d.data()); if (S.ev && !S.eventos.some(e => e.id === S.ev.id)) S.eventos.push(JSON.parse(JSON.stringify(S.ev))); S.pronto = true; if (!S.ev) render(); });
    return;
  }
  const [db, assets, downloads] = await Promise.all([c.use('db'), c.use('assets'), c.use('downloads')]);
  Object.assign(S, {db, assets, downloads});
  if (!db) { S.pronto = true; setSave('pend', 'Só nesta sessão'); render(); return; }
  setSave('ok', 'Salvo');
  db.collection('eventos').onSnapshot(snap => {
    S.eventos = snap.docs.map(d => d.data());
    if (S.ev && !S.eventos.some(e => e.id === S.ev.id)) S.eventos.push(JSON.parse(JSON.stringify(S.ev)));
    S.pronto = true; if (!S.ev) render();
  }, () => { S.pronto = true; setSave('erro', 'Sem conexão com os dados'); if (!S.ev) render(); });
}
boot();
</script>

</body>
</html>
