# Publicador no Render (ambiente de testes enquanto a Cloudflare não está disponível).
# No painel do Render: New → Blueprint → escolher este repositório. GITHUB_TOKEN e SENHA_EQUIPE são pedidos na criação.
services:
  - type: web
    name: publicador-norte
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @norte/web build
    startCommand: corepack pnpm --filter @norte/web start
    healthCheckPath: /entrar
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: GITHUB_REPO
        value: RenanPrates/publicadorNorte
      - key: GITHUB_BRANCH_DADOS
        value: dados
      - key: GITHUB_BRANCH_SITE
        value: gh-pages
      # segredos: preenchidos no painel do Render, nunca no repositório
      - key: GITHUB_TOKEN
        sync: false
      - key: SENHA_EQUIPE
        sync: false
